# i18n-tasks finds missing and unused translations: https://github.com/glebm/i18n-tasks
base_locale: en

data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/devise.%{locale}.yml
    - config/locales/simple_form.%{locale}.yml
  write:
    - config/locales/%{locale}.yml

search:
  paths:
    - app/
  exclude:
    - app/frontend/**/*
    - app/assets/**/*

ignore_unused:
  - 'devise.*'
  - 'simple_form.*'
  - 'activerecord.*'
  - 'errors.messages.*'
  # Reserved for Crudable's flash messages once it's wired through I18n
  # instead of the hardcoded strings it uses today — not referenced yet.
  - 'common.*'
